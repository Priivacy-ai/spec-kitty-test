[pytest]
markers =
    distribution: Distribution tests (real user scenarios, no dev bypasses)
    adversarial: Adversarial tests designed to catch specific bugs
    regression: Regression tests to prevent fixed bugs from returning
    pr_111: Tests for PR #111 (hyphenated agent names)
    pr_104: Tests for PR #104 (workflow git commits)
    pr_99: Tests for PR #99 (dashboard command template)
    edge_cases: Edge case and boundary condition tests
