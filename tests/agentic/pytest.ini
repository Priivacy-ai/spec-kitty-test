# pytest.ini for agentic E2E tests
#
# T039: Implement test filtering (by agent, path, scenario)
# T040: Generate JUnit XML test reports
#
# Usage:
#   pytest tests/agentic/ -v                    # Run all agentic tests
#   pytest tests/agentic/ -v -k "claude"        # Filter by agent
#   pytest tests/agentic/ -v -m "single_agent"  # Filter by path type
#   pytest tests/agentic/ -v -m "not slow"      # Exclude slow tests

[pytest]
# JUnit XML configuration
junit_family = xunit2
junit_suite_name = agentic-e2e-tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options for agentic tests
# Note: These apply when running from this directory
addopts =
    -v
    --tb=short

# Markers (also registered in conftest.py)
markers =
    agentic: mark test as agentic E2E test (requires Docker)
    slow: mark test as slow (real agent invocations)
    distribution: mark as distribution test (PyPI validation)
    isolation: mark as container isolation test
    security: mark as security-related test
    single_agent: mark as single-agent workflow test
    cross_review: mark as cross-review workflow test
    parallel: mark as parallel execution test
    fault_injection: mark as fault injection test
    natural_failure: mark as natural failure observation test
    claude: requires Claude Code agent
    copilot: requires GitHub Copilot agent
    codex: requires GitHub Codex agent
    gemini: requires Google Gemini agent
    cursor: requires Cursor agent
    qwen: requires Qwen Code agent
    opencode: requires OpenCode agent
    kilocode: requires Kilocode agent
    augment: requires Augment Code agent

# Timeout for tests (requires pytest-timeout plugin)
# timeout = 3600

# Strict marker mode (fail on unknown markers)
# strict_markers = true
